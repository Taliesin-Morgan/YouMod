name: Build unsigned FairPlayed.app
on:
  push:
    branches: [fairplayed-ci]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout pinned FairPlayed
        uses: actions/checkout@v4
        with:
          repository: morzelowski/FairPlayed
          ref: bad7df138839b5e0ac8b9f20cc4689140b8436fb
          path: FairPlayed

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Ensure empty payload (no licensed content)
        run: |
          mkdir -p FairPlayed/FairPlayed/payload
          # intentionally empty — YouTube must never enter CI

      - name: Build unsigned iphoneos
        working-directory: FairPlayed/FairPlayed
        run: |
          set -euo pipefail
          xcodebuild \
            -project FairPlayed.xcodeproj \
            -scheme FairPlayed \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build.log
          APP="build/Build/Products/Debug-iphoneos/FairPlayed.app"
          test -d "$APP"
          test -x "$APP/FairPlayed"
          /usr/bin/file "$APP/FairPlayed"
          /usr/bin/plutil -p "$APP/Info.plist" | tee "${GITHUB_WORKSPACE}/app-info.txt"
          lipo -info "$APP/FairPlayed" || true
          if [ -d "$APP/EmbeddedPayload" ]; then
            echo "EmbeddedPayload contents:"; ls -la "$APP/EmbeddedPayload" || true
            if find "$APP/EmbeddedPayload" -iname '*youtube*' | grep -q .; then
              echo "REFUSING: YouTube content in CI artifact" >&2
              exit 1
            fi
          fi

      - name: Package helper artifact
        working-directory: FairPlayed/FairPlayed
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphoneos/FairPlayed.app"
          OUT_ZIP="${GITHUB_WORKSPACE}/FairPlayed-unsigned-helper.zip"
          rm -rf dist
          mkdir -p dist
          ditto "$APP" dist/FairPlayed.app
          rm -rf dist/FairPlayed.app/EmbeddedPayload
          (cd dist && zip -qry "$OUT_ZIP" FairPlayed.app)
          shasum -a 256 "$OUT_ZIP" | tee "${GITHUB_WORKSPACE}/helper.sha256"
          {
            echo "runner=$(uname -a)"
            xcodebuild -version
            echo -n "iphoneos_sdk="
            xcrun --sdk iphoneos --show-sdk-version
          } | tee "${GITHUB_WORKSPACE}/build-meta.txt"
          ls -lh "$OUT_ZIP"
          unzip -l "$OUT_ZIP" | head

      - name: Upload Actions artifact (short retention)
        uses: actions/upload-artifact@v4
        with:
          name: FairPlayed-unsigned-helper
          path: |
            FairPlayed-unsigned-helper.zip
            helper.sha256
            app-info.txt
            build-meta.txt
          retention-days: 3
          if-no-files-found: error

      - name: Publish unsigned helper to ci-artifacts branch (SSH-retrievable)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f FairPlayed-unsigned-helper.zip
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK=$(mktemp -d)
          cp FairPlayed-unsigned-helper.zip helper.sha256 app-info.txt build-meta.txt "$WORK/"
          cd "$WORK"
          git init -q
          git checkout -q -b ci-artifacts
          git add FairPlayed-unsigned-helper.zip helper.sha256 app-info.txt build-meta.txt
          git commit -q -m "ci: unsigned FairPlayed.app @ bad7df138839b5e0ac8b9f20cc4689140b8436fb"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git push -f origin ci-artifacts 2>&1 | tee "${GITHUB_WORKSPACE}/publish.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "publish_failed rc=$rc (likely repo Workflow permissions are read-only)" >&2
            exit "$rc"
          fi
